server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    # Vite fingerprints everything under /assets, so a changed file always gets a new name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The UI calls the API same-origin (src/kosh.js). API_BASE_URL is filled in by the nginx:alpine
    # entrypoint at container start, e.g. https://api-dev.kosh.maatli.com/kosh — so /kosh/v1/x → that + /v1/x.
    location /kosh/ {
        proxy_pass ${API_BASE_URL}/;
        proxy_ssl_server_name on;
        # The API sends no Cache-Control; CloudFront must never cache admin-key responses.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri /index.html;
    }

    # Also hit by the SPA fallback above; must revalidate so a deploy's new asset names are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
